name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        run: |
          brew install xcodegen
          
          mkdir -p App/App
          
          cat > App/App/Main.swift << 'EOF'
import SwiftUI
@main
struct BlackCamApp: App {
  var body: some Scene {
    WindowGroup { ContentView() }
  }
}
EOF

          cat > App/App/ContentView.swift << 'EOF'
import SwiftUI
import AVFoundation
struct ContentView: View {
  @State private var locked = false
  @State private var input = ""
  let code = "1379"
  var body: some View {
    ZStack {
      CameraView()
      if locked {
        Color.black.ignoresSafeArea()
        VStack(spacing: 20) {
          Text(input.isEmpty ? "Enter code" : String(repeating: "●", count: input.count))
            .foregroundColor(.white).font(.title)
          LazyVGrid(columns: Array(repeating: .init(.flexible()), count: 3), spacing: 15) {
            ForEach(["1","2","3","4","5","6","7","8","9","⌫","0","✓"], id: \.self) { k in
              Button(k) {
                if k == "⌫" { if !input.isEmpty { input.removeLast() } }
                else if k == "✓" { if input == code { locked = false; input = "" } else { input = "" } }
                else if input.count < 4 { input += k }
              }
              .frame(width: 70, height: 70)
              .background(Color.gray.opacity(0.3))
              .foregroundColor(.white)
              .font(.title2)
              .cornerRadius(35)
            }
          }.padding()
        }
      } else {
        VStack {
          Spacer()
          Button("Lock Screen") { locked = true }
            .padding()
            .background(Color.black.opacity(0.6))
            .foregroundColor(.white)
            .cornerRadius(12)
            .padding(.bottom, 40)
        }
      }
    }
  }
}
struct CameraView: UIViewRepresentable {
  func makeUIView(context: Context) -> UIView {
    let view = UIView()
    let session = AVCaptureSession()
    guard let device = AVCaptureDevice.default(for: .video),
          let input = try? AVCaptureDeviceInput(device: device) else { return view }
    session.addInput(input)
    let preview = AVCaptureVideoPreviewLayer(session: session)
    preview.videoGravity = .resizeAspectFill
    preview.frame = UIScreen.main.bounds
    view.layer.addSublayer(preview)
    DispatchQueue.global().async { session.startRunning() }
    return view
  }
  func updateUIView(_ uiView: UIView, context: Context) {}
}
EOF

          cat > App/project.yml << 'EOF'
name: App
targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        NSCameraUsageDescription: "Used for background camera view"
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.test.BlackCam
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: "NO"
EOF

          cd App && xcodegen generate
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p output/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app output/Payload/
          cd output && zip -r BlackCam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlackCam.ipa
          path: output/BlackCam.ipa
