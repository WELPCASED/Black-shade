name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA (unsigned)
        run: |
          xcodebuild \
            -project BlackOverlayApp.xcodeproj \
            -scheme BlackOverlayApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into IPA
        run: |
          mkdir -p output/Payload
          cp -r build/Build/Products/Release-iphoneos/BlackOverlayApp.app output/Payload/
          cd output
          zip -r BlackOverlayApp.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: BlackOverlayApp.ipa
          path: output/BlackOverlayApp.ipa
